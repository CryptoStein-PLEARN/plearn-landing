# ─────────────────────────────────────────────────────────────────────────────
# Netlify configuration for PLEARN landing page
#
# SPA routing is also handled by public/_redirects, but this file lets Netlify
# pick up the build settings automatically without dashboard configuration.
# ─────────────────────────────────────────────────────────────────────────────

[build]
  command   = "npm run build"
  publish   = "dist"

[build.environment]
  NODE_VERSION = "20"

# Serverless functions — "Ask Mentor" AI backend lives here.
# Secrets (ANTHROPIC_API_KEY) are set in the Netlify dashboard, never in files.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# SPA fallback — same as public/_redirects, belt-and-suspenders
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
